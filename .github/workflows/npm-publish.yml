name: npm-publish

# 发布 @why-daydream/dsh-tool-idempotency 到 npm。
# 门禁（2026-09-07 评审 round 2 修订）：
#  1. [P1] 发布**已验收归档** compat/acceptance/why-daydream-dsh-tool-idempotency-<版本>.tgz：
#     先 `sha256sum -c compat/acceptance/tgz-<版本>.sha256`，不通过立即失败退出；
#     CI **不重打包**、不发布工作目录产物——发布字节必须等于本地验收过的归档。
#  2. [P2] 发布版本解析自**仓库** package.json（不读取 GITHUB_REF_NAME：手动/分支
#     触发时该变量是分支名，会造成发布成功后复验才失败），并在发布前**显式比对归档
#     tgz 内部的 name/version**（tar 读取 package/package.json，失败即停）。
#  3. tag 触发时，发布前额外校验 tag 版本 == package.json 版本，不一致立即失败。
#  4. 发布后复验：registry dist.integrity == 归档 tgz 的 sha512-integrity。
#  5. 同版本已存在于 registry 且 dist.integrity 与归档一致 → 跳过发布（tag 补推/重放避免
#     E403）；版本已存在但 integrity 不一致 → 立即失败（不得覆盖、不得静默跳过）。
on:
  workflow_dispatch: # 手动触发（发布 compat/acceptance 中已验收归档）
  push:
    tags: ['v*']     # 推送 v* tag 时自动发布

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 解析发布版本并核验归档存在（失败即停）
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "package.json version: $PKG_VERSION"
          TGZ="compat/acceptance/why-daydream-dsh-tool-idempotency-${PKG_VERSION}.tgz"
          SHA="compat/acceptance/tgz-${PKG_VERSION}.sha256"
          test -f "$TGZ" || { echo "缺少已验收归档 $TGZ（请先本地验收并提交该归档与其 sha256）" >&2; exit 1; }
          test -f "$SHA" || { echo "缺少校验文件 $SHA" >&2; exit 1; }

      - name: 显式比对归档内部 name/version 与仓库一致（失败即停）
        run: |
          TGZ="compat/acceptance/why-daydream-dsh-tool-idempotency-${PKG_VERSION}.tgz"
          tar -xzf "$TGZ" -O package/package.json > /tmp/pkg-in-archive.json
          ARCHIVE_NAME=$(node -p "require('/tmp/pkg-in-archive.json').name")
          ARCHIVE_VERSION=$(node -p "require('/tmp/pkg-in-archive.json').version")
          echo "archive internal: ${ARCHIVE_NAME}@${ARCHIVE_VERSION}"
          test "$ARCHIVE_NAME" = "@why-daydream/dsh-tool-idempotency" \
            || { echo "归档内部 name 不一致：${ARCHIVE_NAME}" >&2; exit 1; }
          test "$ARCHIVE_VERSION" = "$PKG_VERSION" \
            || { echo "归档内部 version ${ARCHIVE_VERSION} ≠ 仓库 package.json ${PKG_VERSION}" >&2; exit 1; }
          echo "OK: 归档内部 name/version 与仓库一致"

      - name: tag 触发时校验 tag == package.json 版本（发布前，失败即停）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          test "$TAG_VERSION" = "$PKG_VERSION" \
            || { echo "tag v${TAG_VERSION} 与 package.json 版本 ${PKG_VERSION} 不一致，停止发布" >&2; exit 1; }
          echo "OK: tag ${GITHUB_REF_NAME} 与包版本 ${PKG_VERSION} 一致"

      - name: 校验归档 == 已验收产物（sha256sum -c，失败即停）
        working-directory: compat/acceptance
        run: |
          sha256sum -c "tgz-${PKG_VERSION}.sha256"

      - name: registry 同版本已存在且 integrity 与归档一致 → 跳过发布（避免 E403）
        id: registry-check
        run: |
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "compat/acceptance/why-daydream-dsh-tool-idempotency-${PKG_VERSION}.tgz" | openssl base64 -A)"
          if REG_INTEGRITY=$(npm view "@why-daydream/dsh-tool-idempotency@${PKG_VERSION}" dist.integrity 2>/dev/null); then
            if [ "$REG_INTEGRITY" = "$LOCAL_INTEGRITY" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "OK: registry 已存在 ${PKG_VERSION} 且 dist.integrity 与归档一致，跳过发布"
            else
              echo "ERROR: registry 已存在 ${PKG_VERSION} 但 dist.integrity 与归档不一致（阻止发布，需人工核查）" >&2
              exit 1
            fi
          else
            echo "OK: registry 尚无 ${PKG_VERSION}，继续发布"
          fi

      - name: 发布这份已验收归档（不重打包工作目录）
        if: steps.registry-check.outputs.skip != 'true'
        working-directory: compat/acceptance
        run: npm publish "./why-daydream-dsh-tool-idempotency-${PKG_VERSION}.tgz" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布后复验（registry 产物 == 已验收归档）
        run: |
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "compat/acceptance/why-daydream-dsh-tool-idempotency-${PKG_VERSION}.tgz" | openssl base64 -A)"
          REG_INTEGRITY=$(npm view "@why-daydream/dsh-tool-idempotency@${PKG_VERSION}" dist.integrity)
          echo "local integrity : $LOCAL_INTEGRITY"
          echo "registry        : $REG_INTEGRITY"
          test "$LOCAL_INTEGRITY" = "$REG_INTEGRITY" \
            && echo "OK: registry dist.integrity matches the accepted archive"